<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">From an idea to a working website</title>
  <desc id="description">A three-step diagram showing an idea becoming a conversation and then a website.</desc>
  <rect width="1200" height="675" fill="#170b09"/>
  <g stroke="#d9ccad" stroke-opacity="0.08">
    <path d="M0 75h1200M0 150h1200M0 225h1200M0 300h1200M0 375h1200M0 450h1200M0 525h1200M0 600h1200"/>
    <path d="M100 0v675M200 0v675M300 0v675M400 0v675M500 0v675M600 0v675M700 0v675M800 0v675M900 0v675M1000 0v675M1100 0v675"/>
  </g>
  <g fill="#1e0e0b" stroke="#d9ccad" stroke-opacity="0.35" stroke-width="2">
    <rect x="90" y="265" width="250" height="145"/>
    <rect x="475" y="265" width="250" height="145"/>
    <rect x="860" y="265" width="250" height="145"/>
  </g>
  <g fill="#d9ccad" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="215" y="325" font-size="18" letter-spacing="3">01</text>
    <text x="215" y="365" font-size="30">Idea</text>
    <text x="600" y="325" font-size="18" letter-spacing="3">02</text>
    <text x="600" y="365" font-size="30">Conversation</text>
    <text x="985" y="325" font-size="18" letter-spacing="3">03</text>
    <text x="985" y="365" font-size="30">Website</text>
  </g>
  <g fill="#9ba4d4" font-family="system-ui, sans-serif" font-size="42" text-anchor="middle">
    <text x="405" y="350">→</text>
    <text x="790" y="350">→</text>
  </g>
</svg>
